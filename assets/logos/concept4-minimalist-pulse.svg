<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="100%" height="100%">
  <defs>
    <linearGradient id="c4-pulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="c4-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <!-- LOGO MARK: MINIMALIST GEOMETRIC ENERGY CHEVRON -->
  <g transform="translate(18, 14)">
    <!-- Sleek Rounded Square Tile -->
    <rect x="0" y="0" width="62" height="62" rx="16" fill="#0F172A"/>
    
    <!-- Forward Velocity Energy Slashes forming abstract 'H' & Chevron -->
    <!-- Bar 1 (Left vertical pill) -->
    <rect x="16" y="16" width="6" height="30" rx="3" fill="#FFFFFF"/>
    <!-- Bar 2 (Right vertical pill) -->
    <rect x="40" y="16" width="6" height="30" rx="3" fill="url(#c4-pulse)"/>
    <!-- Center Dynamic Energy Bridge / Slash -->
    <path d="M 22 33 L 40 25 L 40 31 L 22 39 Z" fill="url(#c4-accent)"/>
    
    <!-- Active Green Node -->
    <circle cx="43" cy="18" r="2" fill="#22C55E"/>
  </g>

  <!-- TYPOGRAPHY: LUXURY WIDE-TRACK SANS -->
  <g transform="translate(100, 46)">
    <text font-family="'Manrope', 'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="33" letter-spacing="6" fill="#0F172A">
      HENSHE
    </text>
  </g>
  <g transform="translate(102, 65)">
    <text font-family="'Manrope', sans-serif" font-weight="700" font-size="9.5" letter-spacing="5" fill="#64748B">
      ELECTRIC MOBILITY • INDIA
    </text>
  </g>
</svg>