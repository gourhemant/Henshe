<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <defs>
    <linearGradient id="c3-wing-left" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="c3-wing-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="c3-center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="c3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- LOGO MARK: DUAL PROPULSION WINGS (HEN + SHE) -->
  <g transform="translate(18, 12)">
    <!-- Dark Tech Backdrop Disc -->
    <circle cx="33" cy="33" r="33" fill="#0B132B" filter="url(#c3-shadow)"/>
    <circle cx="33" cy="33" r="31" fill="#021B17" stroke="#059669" stroke-width="1.2" stroke-opacity="0.6"/>

    <!-- Left Wing (HEN - Green Energy) -->
    <path d="M 23 18 C 17 25 17 38 24 47 C 26 49 28 47 27 44 C 23 37 23 27 27 20 C 28 17 25 16 23 18 Z" fill="url(#c3-wing-left)"/>

    <!-- Right Wing (SHE - Electric Momentum) -->
    <path d="M 43 48 C 49 41 49 28 42 19 C 40 17 38 19 39 22 C 43 29 43 39 39 46 C 38 49 41 50 43 48 Z" fill="url(#c3-wing-right)"/>

    <!-- Central Kinetic Nexus / Lightning Bolt -->
    <path d="M 35 21 L 27 34 L 34 34 L 31 45 L 41 31 L 34 31 Z" fill="url(#c3-center)"/>

    <!-- Dual Stars / Satellites -->
    <circle cx="21" cy="18" r="2" fill="#34D399"/>
    <circle cx="45" cy="48" r="2" fill="#38BDF8"/>
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(98, 48)">
    <text font-family="'Manrope', 'Montserrat', sans-serif" font-weight="900" font-size="35" letter-spacing="3" fill="#0F172A">
      HEN<tspan fill="#059669">SHE</tspan>
    </text>
  </g>
  <g transform="translate(100, 67)">
    <text font-family="'Manrope', sans-serif" font-weight="800" font-size="10" letter-spacing="4" fill="#0284C7">
      MOBILITY &amp; VENTURES
    </text>
  </g>
</svg>