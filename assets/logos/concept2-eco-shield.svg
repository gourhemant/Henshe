<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <defs>
    <linearGradient id="c2-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="c2-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="c2-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="c2-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- LOGO MARK: AERODYNAMIC ECO-SHIELD -->
  <g transform="translate(15, 10)">
    <!-- Aerodynamic Shield Polygon -->
    <path d="M 35 6 L 62 16 C 62 44 48 59 35 66 C 22 59 8 44 8 16 Z" fill="url(#c2-dark)" filter="url(#c2-glow)"/>
    <path d="M 35 10 L 58 19 C 58 43 46 56 35 62 C 24 56 12 43 12 19 Z" fill="#031F18" stroke="url(#c2-emerald)" stroke-width="1.5"/>

    <!-- Sustainable Leaf & Battery Circuit Flow -->
    <path d="M 35 18 C 45 25 45 38 35 48 C 25 38 25 25 35 18 Z" fill="none" stroke="url(#c2-emerald)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Sharp Electric Lightning Core -->
    <path d="M 36 24 L 28 36 L 35 36 L 33 46 L 43 33 L 36 33 Z" fill="url(#c2-amber)"/>

    <!-- Green Dot Orbit -->
    <circle cx="35" cy="18" r="2.5" fill="#34D399"/>
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(95, 47)">
    <text font-family="'Manrope', 'Montserrat', sans-serif" font-weight="900" font-size="35" letter-spacing="3" fill="#0F172A">
      HENSHE
    </text>
  </g>
  <g transform="translate(97, 66)">
    <text font-family="'Manrope', sans-serif" font-weight="800" font-size="10" letter-spacing="4" fill="#10B981">
      CLEAN MOBILITY &amp; FLEETS
    </text>
  </g>
</svg>