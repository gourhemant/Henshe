<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="hensheGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#16A34A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 10)">
    <!-- Hex / Energy Shield -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="#064E3B" filter="url(#glow)"/>
    <rect x="3" y="3" width="54" height="54" rx="13" fill="#022C22"/>
    
    <!-- Outer Electric Arc Ring -->
    <circle cx="30" cy="30" r="22" stroke="url(#hensheGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="90 30" fill="none"/>
    
    <!-- High-Voltage Lightning Bolt -->
    <path d="M33 14 L19 32 L28 32 L25 46 L41 27 L31 27 Z" fill="url(#boltGrad)"/>
    <circle cx="37" cy="18" r="2" fill="#22C55E"/>
  </g>

  <!-- Typography: HENSHE -->
  <g transform="translate(82, 48)">
    <text font-family="'Manrope', 'Montserrat', sans-serif" font-weight="900" font-size="34" letter-spacing="2.5" fill="#0F172A">
      HEN<tspan fill="#16A34A">SHE</tspan>
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(84, 65)">
    <text font-family="'Manrope', sans-serif" font-weight="700" font-size="9" letter-spacing="3" fill="#064E3B">
      RIDE • EARN • GROW
    </text>
  </g>
</svg>
